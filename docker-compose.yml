services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rephore
      POSTGRES_PASSWORD: rephore
      POSTGRES_DB: rephore
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      - postgres
      - redis
      - backend

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file: ./frontend/.env.local
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
